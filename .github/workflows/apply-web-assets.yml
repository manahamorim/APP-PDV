name: Apply Web Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode base64 assets into real PNG files
        run: |
          base64 -d asset-src/realme-logo.b64 > realme-logo.png
          base64 -d asset-src/realmeow.b64 > realmeow.png
          ls -la realme-logo.png realmeow.png

      - name: Commit and push generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add realme-logo.png realmeow.png
          git diff --cached --quiet || git commit -m "Apply personalized logo and mascot images"
          git push
